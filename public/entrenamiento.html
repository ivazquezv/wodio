<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrenamiento | WodIO</title>
<meta name="description" content="Timer de entrenamiento de WodIO.">
<link rel="icon" type="image/svg+xml" href="assets/icons/favicon/favicon.svg">
<link rel="stylesheet" href="css/wodio.css">
<link rel="stylesheet" href="css/wodio-app.css">
<script src="https://unpkg.com/phosphor-icons" defer></script>
<style>
.training-page .timer-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.training-page .timer-type{padding:12px 10px;border:1px solid var(--border-soft);border-radius:10px;background:var(--bg-elevated);color:var(--text-main);cursor:pointer;font-weight:700}
.training-page .timer-type:hover,.training-page .timer-type.active{border-color:var(--primary);color:var(--primary-soft);background:rgba(255,107,0,.08)}
.training-page .timer-config{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.training-page .timer-config label{display:grid;gap:5px;color:var(--text-muted);font-size:.75rem}
.training-page .timer-config input{width:100%;padding:11px;border:1px solid var(--border-soft);border-radius:9px;background:var(--bg-elevated);color:var(--text-main)}
.training-page .timer-display{margin-top:18px;padding:32px 22px;text-align:center;border-radius:14px;background:#09090d;border:1px solid var(--border-soft)}
.training-page .timer-display strong{display:block;font-size:clamp(4rem,12vw,8rem);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.training-page .timer-phase{margin-top:12px;color:var(--primary-soft);font-size:.85rem;font-weight:800;text-transform:uppercase}
.training-page .timer-actions{display:flex;justify-content:center;gap:10px;margin-top:16px}
@media(max-width:700px){.training-page .timer-grid{grid-template-columns:repeat(3,1fr)}.training-page .timer-config{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.training-page .timer-grid{grid-template-columns:repeat(2,1fr)}.training-page .timer-config{grid-template-columns:1fr}.training-page .timer-actions{display:grid;grid-template-columns:1fr}.training-page .timer-actions .app-btn{width:100%}}
</style>
</head>
<body class="app-page training-page">
<div class="app-shell">
<header class="app-topbar">
<a class="app-brand" href="dashboard.html"><img src="assets/icons/Logo-WodIO_white.png" alt="WodIO"><span>WodIO</span></a>
<a class="app-back" href="dashboard.html"><i class="ph ph-arrow-left"></i> Dashboard</a>
</header>
<section class="app-hero">
<div><div class="app-eyebrow">Entrenamiento</div><h1>Timer</h1><p>Utiliza únicamente el reloj de entrenamiento. Las clases, pagos y demás funciones están fuera de esta pantalla.</p></div>
</section>
<div id="pageMessage" class="app-message"></div>
<section class="app-card">
<div class="app-card-head"><div><h2>Reloj de entrenamiento</h2><p>Elige el tipo de timer y configúralo según tu entrenamiento.</p></div></div>
<div class="timer-grid">
<button class="timer-type active" data-timer="clock">Reloj</button>
<button class="timer-type" data-timer="tabata">Tabata</button>
<button class="timer-type" data-timer="fortime">For Time</button>
<button class="timer-type" data-timer="amrap">AMRAP</button>
<button class="timer-type" data-timer="emom">EMOM</button>
</div>
<div class="timer-config" id="timerConfig"></div>
<div class="timer-display"><strong id="timerDisplay">00:00</strong><div id="timerPhase" class="timer-phase">Listo</div></div>
<div class="timer-actions">
<button class="app-btn primary" type="button" id="timerStart">Iniciar</button>
<button class="app-btn" type="button" id="timerPause">Pausar</button>
<button class="app-btn" type="button" id="timerReset">Reiniciar</button>
</div>
</section>
</div>
<script>
const timerState={type:"clock",running:false,remaining:0,elapsed:0,interval:null,phase:"Listo",round:1};
const timerConfig=document.getElementById("timerConfig"),timerDisplay=document.getElementById("timerDisplay"),timerPhase=document.getElementById("timerPhase");
const defaults={clock:{duration:3600},tabata:{rounds:8,work:20,rest:10},fortime:{duration:1200},amrap:{duration:600},emom:{duration:1200,interval:60}};
function field(label,id,value){return '<label>'+label+'<input id="'+id+'" type="number" min="1" value="'+value+'"></label>';}
function renderTimerConfig(){const t=timerState.type;timerConfig.innerHTML=t==="tabata"?field("Rondas","timerRounds",defaults.tabata.rounds)+field("Trabajo (seg)","timerWork",defaults.tabata.work)+field("Descanso (seg)","timerRest",defaults.tabata.rest):t==="emom"?field("Duración (min)","timerDuration",20)+field("Cada (min)","timerInterval",1):field("Duración (min)","timerDuration",t==="clock"?60:t==="fortime"?20:10);}
function fmt(sec){sec=Math.max(0,Math.ceil(sec));return String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0");}
function renderTimer(){timerDisplay.textContent=fmt(timerState.remaining);timerPhase.textContent=timerState.phase;}
function configureTimer(){clearInterval(timerState.interval);timerState.running=false;timerState.elapsed=0;timerState.round=1;const t=timerState.type;if(t==="tabata"){timerState.remaining=Number(document.getElementById("timerWork").value);timerState.phase="Trabajo · Ronda 1";}else{timerState.remaining=Number(document.getElementById("timerDuration").value)*60;timerState.phase="Listo";}renderTimer();}
function tickTimer(){
 timerState.elapsed++;
 if(timerState.type==="tabata"){timerState.remaining--;if(timerState.remaining<=0){const rounds=Number(document.getElementById("timerRounds").value),work=Number(document.getElementById("timerWork").value),rest=Number(document.getElementById("timerRest").value);if(timerState.phase.startsWith("Trabajo")){timerState.phase="Descanso";timerState.remaining=rest;}else{if(timerState.round>=rounds){clearInterval(timerState.interval);timerState.running=false;timerState.remaining=0;timerState.phase="Tabata terminado";}else{timerState.round++;timerState.remaining=work;timerState.phase="Trabajo · Ronda "+timerState.round;}}}}
 else if(timerState.type==="emom"){timerState.remaining--;if(timerState.remaining<=0){clearInterval(timerState.interval);timerState.running=false;timerState.phase="EMOM terminado";}else{const interval=Number(document.getElementById("timerInterval").value)*60;const left=timerState.remaining%interval;timerState.phase="EMOM · siguiente minuto en "+fmt(left||interval);}}
 else if(timerState.type==="fortime"){timerState.remaining--;if(timerState.remaining<=0){clearInterval(timerState.interval);timerState.running=false;timerState.remaining=0;timerState.phase="For Time terminado";}}
 else{timerState.remaining--;if(timerState.remaining<=0){clearInterval(timerState.interval);timerState.running=false;timerState.remaining=0;timerState.phase="Tiempo terminado";}}
 renderTimer();
}
document.querySelectorAll(".timer-type").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".timer-type").forEach(x=>x.classList.remove("active"));b.classList.add("active");timerState.type=b.dataset.timer;renderTimerConfig();configureTimer();}));
timerConfig.addEventListener("change",configureTimer);
document.getElementById("timerStart").addEventListener("click",()=>{if(timerState.running)return;timerState.running=true;timerState.interval=setInterval(tickTimer,1000);renderTimer();});
document.getElementById("timerPause").addEventListener("click",()=>{clearInterval(timerState.interval);timerState.running=false;timerState.phase="Pausado";renderTimer();});
document.getElementById("timerReset").addEventListener("click",()=>configureTimer());
renderTimerConfig();configureTimer();
</script>
</body>
</html>
