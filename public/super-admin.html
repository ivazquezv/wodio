<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Super administración | WodIO</title><meta name="robots" content="noindex,nofollow"><link rel="icon" type="image/svg+xml" href="assets/icons/favicon/favicon.svg"><link rel="stylesheet" href="css/wodio.css"><link rel="stylesheet" href="css/wodio-app.css"><script src="https://unpkg.com/phosphor-icons" defer></script></head>
<body class="app-page"><div class="app-shell"><header class="app-topbar"><a class="app-brand" href="super-admin.html"><img src="assets/icons/Logo-WodIO_white.png" alt="WodIO"><span>WodIO Super Admin</span></a><button class="app-btn" id="logoutButton"><i class="ph ph-sign-out"></i> Salir</button></header><section class="app-hero"><div><div class="app-eyebrow">Plataforma WodIO</div><h1>Super administración</h1><p>Visión global de los boxes y usuarios de la plataforma.</p></div></section><div id="msg" class="app-message"></div><section class="app-grid app-grid-3"><div class="app-card app-stat"><div class="app-stat-value" id="boxes">—</div><div class="app-stat-label">Boxes</div></div><div class="app-card app-stat"><div class="app-stat-value" id="users">—</div><div class="app-stat-label">Usuarios</div></div><div class="app-card app-stat"><div class="app-stat-value" id="admins">—</div><div class="app-stat-label">Administradores</div></div></section><section class="app-card" style="margin-top:18px"><div class="app-card-head"><div><h2>Boxes</h2><p>Estado y propietarios.</p></div></div><div id="table" class="app-table-wrap"></div></section></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config/supabase-config.js"></script><script src="js/supabase.js"></script><script src="js/wodio-app.js"></script><script>
document.addEventListener("DOMContentLoaded",async()=>{const ctx=await WodIOApp.requireUser({roles:["super_admin"]});if(!ctx)return;const [b,u]=await Promise.all([supabaseClient.from("boxes").select("id,name,slug,status,created_at,owner_id").order("created_at",{ascending:false}),supabaseClient.from("profiles").select("id,first_name,last_name,role,box_id").order("created_at",{ascending:false})]);if(b.error||u.error){WodIOApp.message(document.getElementById("msg"),b.error?.message||u.error?.message);return;}document.getElementById("boxes").textContent=(b.data||[]).length;document.getElementById("users").textContent=(u.data||[]).length;document.getElementById("admins").textContent=(u.data||[]).filter(v=>v.role==="box_admin").length;document.getElementById("table").innerHTML='<table class="app-table"><thead><tr><th>Box</th><th>Slug</th><th>Estado</th><th>Usuarios</th><th>Alta</th></tr></thead><tbody>'+(b.data||[]).map(v=>'<tr><td>'+WodIOApp.escapeHtml(v.name)+'</td><td>'+WodIOApp.escapeHtml(v.slug)+'</td><td><span class="app-badge">'+WodIOApp.escapeHtml(v.status||"—")+'</span></td><td>'+u.data.filter(x=>x.box_id===v.id).length+'</td><td>'+WodIOApp.formatDate(v.created_at,{withYear:true})+'</td></tr>').join("")+'</tbody></table>';WodIOApp.bindLogout();});
</script></body></html>
