<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coach | WodIO</title><meta name="robots" content="noindex,nofollow"><link rel="icon" type="image/svg+xml" href="assets/icons/favicon/favicon.svg"><link rel="stylesheet" href="css/wodio.css"><link rel="stylesheet" href="css/wodio-app.css"><script src="https://unpkg.com/phosphor-icons" defer></script></head>
<body class="app-page"><div class="app-shell">
<header class="app-topbar"><a class="app-brand" href="coach-dashboard.html"><img src="assets/icons/Logo-WodIO_white.png" alt="WodIO"><span>WodIO Coach</span></a><button class="app-btn" id="logoutButton"><i class="ph ph-sign-out"></i> Salir</button></header>
<section class="app-hero"><div><div class="app-eyebrow">Área del coach</div><h1 id="title">Panel del coach</h1><p>Consulta tus clases, alumnos y programación.</p></div></section>
<div id="msg" class="app-message"></div>
<section class="app-grid app-grid-3"><div class="app-card app-stat"><div class="app-stat-icon"><i class="ph ph-calendar"></i></div><div><div id="classesCount" class="app-stat-value">—</div><div class="app-stat-label">Clases próximas</div></div></div><div class="app-card app-stat"><div class="app-stat-icon"><i class="ph ph-users"></i></div><div><div id="clientsCount" class="app-stat-value">—</div><div class="app-stat-label">Clientes del box</div></div></div><div class="app-card app-stat"><div class="app-stat-icon"><i class="ph ph-buildings"></i></div><div><div id="boxName" class="app-stat-value" style="font-size:1.15rem">—</div><div class="app-stat-label">Box</div></div></div></section>
<section class="app-card" style="margin-top:18px"><div class="app-card-head"><div><h2>Mis próximas clases</h2><p>Sesiones asignadas a tu perfil.</p></div></div><div id="classes" class="app-list"></div></section>
<section class="app-card" style="margin-top:18px"><div class="app-card-head"><div><h2>Clientes</h2><p>Atletas vinculados al box.</p></div></div><div id="clients" class="app-table-wrap"></div></section>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config/supabase-config.js"></script><script src="js/supabase.js"></script><script src="js/wodio-app.js"></script>
<script>
document.addEventListener("DOMContentLoaded",async()=>{const ctx=await WodIOApp.requireUser({roles:["coach","box_admin","super_admin"]});if(!ctx)return;const boxId=ctx.profile?.box_id;if(!boxId){WodIOApp.message(document.getElementById("msg"),"No hay box asignado.");return;}const n=v=>[v?.first_name,v?.last_name].filter(Boolean).join(" ")||"Usuario";const [{data:b},{data:c},{data:u}]=await Promise.all([supabaseClient.from("boxes").select("name").eq("id",boxId).single(),supabaseClient.from("classes").select("id,title,starts_at,capacity,coach_id,workout").eq("box_id",boxId).eq("coach_id",ctx.user.id).gte("starts_at",new Date().toISOString()).order("starts_at").limit(20),supabaseClient.from("profiles").select("first_name,last_name,role,created_at").eq("box_id",boxId).eq("role","athlete").order("first_name")]);document.getElementById("title").textContent="Hola, "+n(ctx.profile);document.getElementById("boxName").textContent=b?.name||"—";document.getElementById("classesCount").textContent=(c||[]).length;document.getElementById("clientsCount").textContent=(u||[]).length;document.getElementById("classes").innerHTML=(c||[]).length?c.map(v=>'<article class="app-item"><div class="app-item-main"><div class="app-item-title">'+WodIOApp.escapeHtml(v.title)+'</div><div class="app-item-meta"><span>'+WodIOApp.formatDateTime(v.starts_at)+'</span><span>'+v.capacity+' plazas</span><span>'+WodIOApp.escapeHtml(v.workout||"Sin WOD")+'</span></div></div></article>').join(""):'<div class="app-empty">No tienes clases próximas.</div>';document.getElementById("clients").innerHTML=(u||[]).length?'<table class="app-table"><thead><tr><th>Cliente</th><th>Alta</th></tr></thead><tbody>'+u.map(v=>'<tr><td>'+WodIOApp.escapeHtml(n(v))+'</td><td>'+WodIOApp.formatDate(v.created_at,{withYear:true})+'</td></tr>').join("")+'</tbody></table>':'<div class="app-empty">No hay clientes.</div>';WodIOApp.bindLogout();});
</script></body></html>
