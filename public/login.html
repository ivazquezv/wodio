<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>WodIO - Login</title>

    <!-- Favicon y manifest -->
    <link rel="icon" type="image/svg+xml" href="/public/assets/icons/favicon/favicon.svg">
    <link rel="alternate icon" type="image/png" href="/public/assets/icons/favicon/favicon-96x96.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/public/assets/icons/favicon/apple-touch-icon.png">
    <link rel="manifest" href="/public/assets/icons/favicon/site.webmanifest">
    <meta name="theme-color" content="#000000">

    <!-- CSS global -->
    <link rel="stylesheet" href="/src/css/wodio.css">

    <!-- Iconos -->
    <script src="https://unpkg.com/phosphor-icons"></script>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="navbar-left">
            <img src="/public/assets/icons/Logo-WodIO_white.png" class="logo" alt="WodIO logo">
        </div>
    </nav>

    <!-- LOGIN -->
    <main class="login-wrapper">

        <img src="/public/assets/icons/Logo-WodIO_white.png" class="login-logo" alt="WodIO logo">

        <h1 class="hero-title"><i class="ph ph-sign-in"></i> Iniciar sesión</h1>

        <form class="login-card">

            <label for="email"><i class="ph ph-envelope"></i> Correo electrónico</label>
            <input id="email" type="email" placeholder="tuemail@ejemplo.com" required>

            <label for="password"><i class="ph ph-lock"></i> Contraseña</label>
            <input id="password" type="password" placeholder="••••••••" required>

            <button class="login-btn" type="submit">
                <i class="ph ph-arrow-right"></i>
                Entrar
            </button>

            <div class="login-links">
                <a href="password-reset.html">He olvidado mi contraseña</a>
                <a href="register.html">Crear cuenta</a>
            </div>

        </form>

    </main>

    <!-- FOOTER -->
    <footer class="footer">
        © 2026 WodIO — Plataforma de gestión para boxes y atletas
    </footer>

</body>

</html>
